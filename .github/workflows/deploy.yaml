name: Despliegue de MyST Site

on:
  push:
    branches:
      - main
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para que la acción cree la rama gh-pages

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usamos la v20 que es la LTS estable en 2026

      - name: Instalar MyST
        run: npm install -g mystmd

      - name: Construir el sitio (Build)
        run: myst build --html

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          force_orphan: true
